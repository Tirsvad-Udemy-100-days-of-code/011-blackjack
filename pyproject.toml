[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "blackjack"
version = "0.1.0"
description = "Console Blackjack game against a computer dealer (Udemy 100 Days of Code, day 11)."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Jens Tirsvad Nielsen" }]
dependencies = []

[project.urls]
Repository = "https://git.tirsystem.com/Tirsvad-Udemy-100-days-of-code/011-blackjack"
Documentation = "https://git.tirsystem.com/Tirsvad-Udemy-100-days-of-code/011-blackjack/wiki"
"Issue tracker" = "https://git.tirsystem.com/Tirsvad-Udemy-100-days-of-code/011-blackjack/issues"

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
mypy_path = "src"
